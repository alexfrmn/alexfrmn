<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Alexander Vasiliev — CTO, AI Systems, Enterprise Infrastructure">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="g">
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="#080b0f"/>

  <g opacity="0.3" stroke="#173330" stroke-width="1">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200"/>
    <path d="M700 0 V320 M880 0 V320 M1060 0 V320"/>
  </g>

  <g transform="translate(706,44) scale(0.92)">
    <circle cx="180" cy="110" r="78" fill="url(#glow)">
      <animate attributeName="opacity" values="0.4;0.85;0.4" dur="6s" repeatCount="indefinite"/>
    </circle>

    <g stroke="#2a5b57" stroke-width="1.4" fill="none">
      <path id="e1" d="M60 40 L180 110"/>
      <path id="e2" d="M180 110 L340 30"/>
      <path id="e3" d="M180 110 L120 210"/>
      <path id="e4" d="M180 110 L360 175"/>
      <path id="e5" d="M120 210 L360 175"/>
      <path id="e6" d="M60 40 L340 30"/>
    </g>

    <g fill="#5eead4">
      <circle r="3.5"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle r="3.5"><animateMotion dur="4.1s" begin="0.6s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="4.1s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle r="3.5"><animateMotion dur="3.7s" begin="1.4s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="3.7s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle r="3.5"><animateMotion dur="4.6s" begin="2.1s" repeatCount="indefinite"><mpath href="#e5"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="4.6s" begin="2.1s" repeatCount="indefinite"/></circle>
      <circle r="3.5"><animateMotion dur="5.2s" begin="0.2s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="5.2s" begin="0.2s" repeatCount="indefinite"/></circle>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#4a7d78">
      <circle cx="60" cy="40" r="6" fill="#080b0f" stroke="#5eead4" stroke-width="1.6"/>
      <text x="60" y="22" text-anchor="middle" textLength="72" lengthAdjust="spacingAndGlyphs">claude-code</text>
      <circle cx="340" cy="30" r="6" fill="#080b0f" stroke="#5eead4" stroke-width="1.6"/>
      <text x="340" y="12" text-anchor="middle" textLength="36" lengthAdjust="spacingAndGlyphs">codex</text>
      <circle cx="120" cy="210" r="6" fill="#080b0f" stroke="#5eead4" stroke-width="1.6"/>
      <text x="120" y="232" text-anchor="middle" textLength="22" lengthAdjust="spacingAndGlyphs">vps</text>
      <circle cx="360" cy="175" r="6" fill="#080b0f" stroke="#5eead4" stroke-width="1.6"/>
      <text x="360" y="197" text-anchor="middle" textLength="64" lengthAdjust="spacingAndGlyphs">bare-metal</text>
      <circle cx="180" cy="110" r="10" fill="#5eead4"><animate attributeName="r" values="9;12;9" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="180" y="140" text-anchor="middle" fill="#5eead4" font-size="11" textLength="48" lengthAdjust="spacingAndGlyphs">murmur</text>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="72" y="96" fill="#3f6e6a" font-size="13" textLength="248" lengthAdjust="spacingAndGlyphs">18 YEARS · MOSCOW</text>
    <text x="72" y="170" fill="#e6f5f2" font-size="50" font-weight="600" textLength="556" lengthAdjust="spacingAndGlyphs">ALEXANDER VASILIEV</text>
    <rect x="72" y="190" width="556" height="2" fill="url(#fade)"/>
    <text x="72" y="230" fill="#5eead4" font-size="16" textLength="556" lengthAdjust="spacingAndGlyphs">CTO · AI SYSTEMS · ENTERPRISE INFRASTRUCTURE</text>
    <text x="72" y="266" fill="#3f6e6a" font-size="13" textLength="392" lengthAdjust="spacingAndGlyphs">$ building the infrastructure AI agents run on</text>
    <rect x="472" y="255" width="7" height="14" fill="#5eead4">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect width="1200" height="320" filter="url(#grain)" fill="none" opacity="0.5"/>
  <rect x="1" y="1" width="1198" height="318" fill="none" stroke="#16302e" stroke-width="2"/>
</svg>
