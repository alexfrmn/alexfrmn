<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Alexander Vasiliev — CTO, AI Systems, Enterprise Infrastructure">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="g">
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="380" fill="#080b0f"/>

  <g opacity="0.3" stroke="#173330" stroke-width="1">
    <path d="M0 95 H1200 M0 190 H1200 M0 285 H1200"/>
    <path d="M640 0 V380 M820 0 V380 M1000 0 V380"/>
  </g>

  <g transform="translate(648,58) scale(1.15)">
    <circle cx="180" cy="110" r="82" fill="url(#glow)">
      <animate attributeName="opacity" values="0.4;0.85;0.4" dur="6s" repeatCount="indefinite"/>
    </circle>

    <g stroke="#2a5b57" stroke-width="1.3" fill="none">
      <path id="e1" d="M60 40 L180 110"/>
      <path id="e2" d="M180 110 L340 30"/>
      <path id="e3" d="M180 110 L120 210"/>
      <path id="e4" d="M180 110 L360 175"/>
      <path id="e5" d="M120 210 L360 175"/>
      <path id="e6" d="M60 40 L340 30"/>
    </g>

    <g fill="#5eead4">
      <circle r="3.2"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle r="3.2"><animateMotion dur="4.1s" begin="0.6s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="4.1s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle r="3.2"><animateMotion dur="3.7s" begin="1.4s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="3.7s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle r="3.2"><animateMotion dur="4.6s" begin="2.1s" repeatCount="indefinite"><mpath href="#e5"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="4.6s" begin="2.1s" repeatCount="indefinite"/></circle>
      <circle r="3.2"><animateMotion dur="5.2s" begin="0.2s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="5.2s" begin="0.2s" repeatCount="indefinite"/></circle>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#4a7d78">
      <circle cx="60" cy="40" r="5.5" fill="#080b0f" stroke="#5eead4" stroke-width="1.5"/>
      <text x="60" y="22" text-anchor="middle" textLength="64" lengthAdjust="spacingAndGlyphs">claude-code</text>
      <circle cx="340" cy="30" r="5.5" fill="#080b0f" stroke="#5eead4" stroke-width="1.5"/>
      <text x="340" y="12" text-anchor="middle" textLength="32" lengthAdjust="spacingAndGlyphs">codex</text>
      <circle cx="120" cy="210" r="5.5" fill="#080b0f" stroke="#5eead4" stroke-width="1.5"/>
      <text x="120" y="230" text-anchor="middle" textLength="20" lengthAdjust="spacingAndGlyphs">vps</text>
      <circle cx="360" cy="175" r="5.5" fill="#080b0f" stroke="#5eead4" stroke-width="1.5"/>
      <text x="360" y="195" text-anchor="middle" textLength="58" lengthAdjust="spacingAndGlyphs">bare-metal</text>
      <circle cx="180" cy="110" r="9" fill="#5eead4"><animate attributeName="r" values="8;11;8" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="180" y="138" text-anchor="middle" fill="#5eead4" font-size="11" textLength="44" lengthAdjust="spacingAndGlyphs">murmur</text>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="132" fill="#3f6e6a" font-size="13" textLength="238" lengthAdjust="spacingAndGlyphs">18 YEARS · MOSCOW</text>
    <text x="64" y="210" fill="#e6f5f2" font-size="54" font-weight="600" textLength="536" lengthAdjust="spacingAndGlyphs">ALEXANDER VASILIEV</text>
    <rect x="64" y="232" width="536" height="2" fill="url(#fade)"/>
    <text x="64" y="272" fill="#5eead4" font-size="15" textLength="536" lengthAdjust="spacingAndGlyphs">CTO · AI SYSTEMS · ENTERPRISE INFRASTRUCTURE</text>
    <text x="64" y="314" fill="#3f6e6a" font-size="13" textLength="384" lengthAdjust="spacingAndGlyphs">$ building the infrastructure AI agents run on</text>
    <rect x="456" y="303" width="7" height="14" fill="#5eead4">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect width="1200" height="380" filter="url(#grain)" fill="none" opacity="0.5"/>
  <rect x="1" y="1" width="1198" height="378" fill="none" stroke="#16302e" stroke-width="2"/>
</svg>
